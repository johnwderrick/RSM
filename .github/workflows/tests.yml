name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      # "iPhone 16" matches the simulators preinstalled on GitHub's macos-15
      # image as of when this was written (confirmed working in the first
      # run of this workflow) — if this job starts failing with "Unable to
      # find a destination", run `xcrun simctl list devices` in a step here
      # to see what's actually available and update the device name below.
      - name: Run tests
        run: |
          xcodebuild test \
            -project "Retro Season Manager.xcodeproj" \
            -scheme "Retro Season Manager" \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
